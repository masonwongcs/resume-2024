<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Radial gradient for smooth displacement -->
  <defs>
    <radialGradient id="displacement" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:white;stop-opacity:1" />
      <stop offset="100%" style="stop-color:black;stop-opacity:1" />
    </radialGradient>
    
    <!-- Noise filter for organic texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="5" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend mode="multiply" in2="SourceGraphic" />
    </filter>
  </defs>
  
  <!-- Base circle with gradient -->
  <circle cx="256" cy="256" r="256" fill="url(#displacement)" />
  
  <!-- Noise overlay -->
  <rect width="512" height="512" fill="white" filter="url(#noise)" opacity="0.1" />
</svg>